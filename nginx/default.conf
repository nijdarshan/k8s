server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/orders {
        return 503;
    }

    location /api/reports {
        return 502;
    }
}

server {
    listen 8080;
    server_name _;
    access_log off;

    location /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
